spring.application.name=JWT_springboot3
server.port=8005

# H2 Database configuration (chạy ngay không cần cài đặt MySQL)
spring.datasource.url=jdbc:h2:mem:jwt_springboot3;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# (Nếu dùng MySQL thật, hãy bỏ comment các dòng dưới):
# spring.datasource.url=jdbc:mysql://localhost:3306/jwt_springboot3?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
# spring.datasource.username=root
# spring.datasource.password=1234567@a$
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Security JWT configuration
security.jwt.secret-key=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
# 1h in millisecond
security.jwt.expiration-time=3600000
