<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="utf-8">
    <title>Thông Tin Cá Nhân - JWT Security</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            min-height: 100vh;
            padding: 2rem 1rem;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        .profile-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            max-width: 650px;
            margin: 0 auto;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .profile-header {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            padding: 2.5rem 2rem;
            text-align: center;
            position: relative;
        }
        .avatar-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #ffffff;
            color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            margin: 0 auto 1rem;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            border: 4px solid rgba(255, 255, 255, 0.3);
            object-fit: cover;
        }
        .token-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 1rem;
            font-family: monospace;
            font-size: 0.85rem;
            word-break: break-all;
            color: #334155;
            max-height: 120px;
            overflow-y: auto;
        }
        .badge-verified {
            background-color: #10b981;
            color: white;
            font-size: 0.8rem;
            padding: 0.4rem 0.8rem;
            border-radius: 50px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="profile-card">
        <div class="profile-header">
            <img id="images" src="" alt="Avatar" class="avatar-circle d-none">
            <div id="avatarPlaceholder" class="avatar-circle">
                <i class="bi bi-person-fill"></i>
            </div>
            <h3 id="profile" class="fw-bold mb-1">Đang tải...</h3>
            <p id="userEmail" class="opacity-75 mb-2"></p>
            <span class="badge badge-verified"><i class="bi bi-patch-check-fill me-1"></i>JWT Authenticated (Nimbus JOSE)</span>
        </div>

        <div class="p-4">
            <div id="feedback" class="alert alert-danger d-none" role="alert"></div>

            <h5 class="fw-semibold text-secondary mb-3"><i class="bi bi-info-circle me-2"></i>Chi Tiết Tài Khoản</h5>
            <div class="row g-3 mb-4">
                <div class="col-sm-6">
                    <div class="p-3 bg-light rounded-3 border">
                        <small class="text-muted d-block">Mã ID Người Dùng</small>
                        <span id="userId" class="fw-bold text-dark">-</span>
                    </div>
                </div>
                <div class="col-sm-6">
                    <div class="p-3 bg-light rounded-3 border">
                        <small class="text-muted d-block">Trạng Thái Tài Khoản</small>
                        <span class="badge bg-success">Hoạt Động (Active)</span>
                    </div>
                </div>
            </div>

            <h5 class="fw-semibold text-secondary mb-2"><i class="bi bi-key me-2"></i>Bearer JWT Token (Nimbus)</h5>
            <div id="tokenDisplay" class="token-box mb-4">
                Đang nạp token từ localStorage...
            </div>

            <div class="d-flex justify-content-between align-items-center pt-2 border-top">
                <a href="/login" class="text-decoration-none text-muted"><i class="bi bi-arrow-left me-1"></i>Quay lại</a>
                <button id="logout" class="btn btn-outline-danger px-4 fw-semibold">
                    <i class="bi bi-box-arrow-right me-1"></i>Đăng Xuất
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="/js/mainjs.js"></script>
</body>
</html>
