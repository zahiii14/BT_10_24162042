<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="utf-8">
    <title>Xác Thực JWT - Nimbus JOSE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        .auth-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .auth-header {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            padding: 2rem 1.5rem 1.5rem;
            text-align: center;
        }
        .auth-header h4 {
            font-weight: 700;
            margin-bottom: 0.25rem;
        }
        .auth-header p {
            opacity: 0.85;
            font-size: 0.875rem;
            margin-bottom: 0;
        }
        .nav-tabs .nav-link {
            color: #64748b;
            font-weight: 600;
            border: none;
            border-bottom: 3px solid transparent;
            padding: 0.75rem 1rem;
        }
        .nav-tabs .nav-link.active {
            color: #2563eb;
            background: transparent;
            border-bottom: 3px solid #2563eb;
        }
        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
        }
        .btn-primary {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border: none;
            padding: 0.75rem;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="auth-header">
        <div class="mb-2">
            <i class="bi bi-shield-lock-fill display-5"></i>
        </div>
        <h4>JWT Authentication</h4>
        <p>Nimbus JOSE + Spring Boot 3 Security</p>
    </div>

    <div class="p-4">
        <!-- Alert feedback -->
        <div id="alertBox" class="alert d-none" role="alert"></div>

        <!-- Navigation Tabs -->
        <ul class="nav nav-tabs nav-justified mb-4" id="authTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-panel" type="button">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Đăng Nhập
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-panel" type="button">
                    <i class="bi bi-person-plus me-1"></i>Đăng Ký
                </button>
            </li>
        </ul>

        <div class="tab-content" id="authTabContent">
            <!-- Form Đăng Nhập -->
            <div class="tab-pane fade show active" id="login-panel" role="tabpanel">
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label text-secondary fw-semibold">Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-envelope text-secondary"></i></span>
                            <input type="email" class="form-control" id="email" value="24162042@student.hcmute.edu.vn" required placeholder="name@example.com">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-secondary fw-semibold">Mật khẩu</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock text-secondary"></i></span>
                            <input type="password" class="form-control" id="password" value="123456" required placeholder="••••••••">
                        </div>
                    </div>
                    <button id="Login" type="button" class="btn btn-primary w-100 mb-2">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Đăng Nhập
                    </button>
                </form>
            </div>

            <!-- Form Đăng Ký -->
            <div class="tab-pane fade" id="register-panel" role="tabpanel">
                <form id="registerForm">
                    <div class="mb-3">
                        <label class="form-label text-secondary fw-semibold">Họ và Tên</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person text-secondary"></i></span>
                            <input type="text" class="form-control" id="regFullName" value="Kim Gia Huy" required placeholder="Kim Gia Huy">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-secondary fw-semibold">Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-envelope text-secondary"></i></span>
                            <input type="email" class="form-control" id="regEmail" value="24162042@student.hcmute.edu.vn" required placeholder="name@example.com">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-secondary fw-semibold">Mật khẩu</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock text-secondary"></i></span>
                            <input type="password" class="form-control" id="regPassword" value="123456" required placeholder="••••••••">
                        </div>
                    </div>
                    <button id="Register" type="button" class="btn btn-success w-100 mb-2" style="background: linear-gradient(135deg, #059669, #10b981); border:none;">
                        <i class="bi bi-check-circle me-1"></i>Tạo Tài Khoản
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="/js/mainjs.js"></script>
</body>
</html>
